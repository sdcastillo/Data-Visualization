<line x1="56" y1="298.0" x2="744" y2="298.0" stroke="#123055"/>
<text x="56.0" y="318" text-anchor="middle" font-family="Source Sans 3, Helvetica, sans-serif" font-size="12" fill="#4c6272">0</text>
<text x="287.0" y="318" text-anchor="middle" font-family="Source Sans 3, Helvetica, sans-serif" font-size="12" fill="#4c6272">100</text>
<text x="518.0" y="318" text-anchor="middle" font-family="Source Sans 3, Helvetica, sans-serif" font-size="12" fill="#4c6272">200</text>
<text x="744.0" y="318" text-anchor="middle" font-family="Source Sans 3, Helvetica, sans-serif" font-size="12" fill="#4c6272">300</text>
<text x="400.0" y="336" text-anchor="middle" font-family="Source Sans 3, Helvetica, sans-serif" font-size="13" fill="#123055">Number of readmissions</text>
