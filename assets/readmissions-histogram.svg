<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img">
<title>Hospital readmission counts, bins of 20, from 0 to 300</title>
<desc>Bar height is the number of hospital-measure rows in each bin. The 20 to 40 and 40 to 60 bins are marked because they hold the 30 to 50 band discussed in the slides.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<line x1="56" y1="298.0" x2="744" y2="298.0" stroke="#e5f0ef"/>
<text x="48" y="302.0" text-anchor="end" font-family="Source Sans 3, Helvetica, sans-serif" font-size="12" fill="#4c6272">0</text>
<line x1="56" y1="206.8" x2="744" y2="206.8" stroke="#e5f0ef"/>
<text x="48" y="210.8" text-anchor="end" font-family="Source Sans 3, Helvetica, sans-serif" font-size="12" fill="#4c6272">1,000</text>
<line x1="56" y1="115.6" x2="744" y2="115.6" stroke="#e5f0ef"/>
<text x="48" y="119.6" text-anchor="end" font-family="Source Sans 3, Helvetica, sans-serif" font-size="12" fill="#4c6272">2,000</text>
<line x1="56" y1="24.5" x2="744" y2="24.5" stroke="#e5f0ef"/>
<text x="48" y="28.5" text-anchor="end" font-family="Source Sans 3, Helvetica, sans-serif" font-size="12" fill="#4c6272">3,000</text>
<rect x="56.0" y="87.8" width="41.2" height="210.2" rx="3" fill="#c5d5df"><title>0 to 20: 2,305 rows</title></rect>
<rect x="102.2" y="18.0" width="41.2" height="280.0" rx="3" fill="#0f5f5b"><title>20 to 40: 3,071 rows</title></rect>
<rect x="148.4" y="123.0" width="41.2" height="175.0" rx="3" fill="#0f5f5b"><title>40 to 60: 1,919 rows</title></rect>
<rect x="194.6" y="184.9" width="41.2" height="113.1" rx="3" fill="#c5d5df"><title>60 to 80: 1,241 rows</title></rect>
<rect x="240.8" y="214.8" width="41.2" height="83.2" rx="3" fill="#c5d5df"><title>80 to 100: 912 rows</title></rect>
<rect x="287.0" y="245.0" width="41.2" height="53.0" rx="3" fill="#c5d5df"><title>100 to 120: 581 rows</title></rect>
<rect x="333.2" y="259.2" width="41.2" height="38.8" rx="3" fill="#c5d5df"><title>120 to 140: 426 rows</title></rect>
<rect x="379.4" y="269.3" width="41.2" height="28.7" rx="3" fill="#c5d5df"><title>140 to 160: 315 rows</title></rect>
<rect x="425.6" y="279.4" width="41.2" height="18.6" rx="3" fill="#c5d5df"><title>160 to 180: 204 rows</title></rect>
<rect x="471.8" y="286.7" width="41.2" height="11.3" rx="3" fill="#c5d5df"><title>180 to 200: 124 rows</title></rect>
<rect x="518.0" y="287.9" width="41.2" height="10.1" rx="3" fill="#c5d5df"><title>200 to 220: 111 rows</title></rect>
<rect x="564.2" y="290.3" width="41.2" height="7.7" rx="3" fill="#c5d5df"><title>220 to 240: 85 rows</title></rect>
<rect x="610.4" y="292.5" width="41.2" height="5.5" rx="3" fill="#c5d5df"><title>240 to 260: 60 rows</title></rect>
<rect x="656.6" y="294.1" width="41.2" height="3.9" rx="3" fill="#c5d5df"><title>260 to 280: 43 rows</title></rect>
